name: Build APK

# Produces installable APKs you can download from the run's Artifacts section.
# Run it by hand from the Actions tab (any branch, pick the variant and ABI), or let it
# run automatically on main, Codex working branches, and pull requests.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]
      abi:
        description: 'ABI to build ("all" produces every split plus a universal APK)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64, x86, universal, all]
  push:
    branches: [main, 'codex/**']
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'LICENSE'
      - '.github/FUNDING.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Resolve build parameters
        id: params
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Capitalise for the Gradle task name: assembleDebug / assembleRelease.
          task="assemble$(printf '%s' "${BUILD_TYPE:0:1}" | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

          # On a pull_request event github.sha is the *merge* commit GitHub built, not the
          # commit that was pushed, so artifacts were named after a SHA that appears nowhere
          # in the branch. Prefer the head SHA, and shorten it to something readable.
          sha="${HEAD_SHA:-$GITHUB_SHA}"
          echo "sha=${sha:0:8}" >> "$GITHUB_OUTPUT"

          # "all" keeps the project defaults (every split plus universal). A single ABI keeps
          # CI fast; "universal" turns splitting off and builds one fat APK.
          case "$ABI" in
            all)       args='' ;;
            universal) args='-PenableApkSplits=false' ;;
            *)         args="-PtargetAbi=$ABI -PincludeUniversalApk=false" ;;
          esac
          echo "gradle_args=$args" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        if: steps.params.outputs.build_type == 'release'
        id: keystore
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          set -euo pipefail
          # Fork pull requests cannot read secrets, and neither can a fresh clone of this
          # repo. Those runs still build - the release variant just comes out unsigned.
          if [ -z "${KEYSTORE:-}" ]; then
            echo "No KEYSTORE secret available; a release build would be unsigned."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build
        # No KEYSTORE_PATH: the decode step writes to $GITHUB_WORKSPACE/release.keystore,
        # which is already where the build script looks by default.
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ${{ steps.params.outputs.task }} ${{ steps.params.outputs.gradle_args }} --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.keystore"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarise APKs
        run: |
          set -euo pipefail
          dir="app/build/outputs/apk/${{ steps.params.outputs.build_type }}"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          : > "$dir/SHA256SUMS"
          {
            echo "### APKs"
            echo
            echo "Variant: \`${{ steps.params.outputs.build_type }}\` · Commit: \`${{ steps.params.outputs.sha }}\`"
