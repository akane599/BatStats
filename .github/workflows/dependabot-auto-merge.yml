name: Dependabot auto-merge
on: pull_request

# The reusable workflow declares `contents: write` and `pull-requests: write`. A caller
# that grants nothing inherits the repository default, which is read-only here, and a
# workflow cannot be started asking for more than it is allowed - which is why every run
# of this ended in startup_failure rather than in a job.
permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    # Nothing here applies to a hand-written pull request, so skip rather than queue a job
    # that has no work to do. Checked on the PR's author instead of github.actor, which is
    # whoever triggered the event - a human re-running a Dependabot PR would not match.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: mlm-games/ci/.github/workflows/dependabot-auto-merge.yml@v1
