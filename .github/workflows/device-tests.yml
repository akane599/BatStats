name: Device regression tests
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['**.md', 'fastlane/**', 'LICENSE']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            font: '1.0'
          - api: 36
            font: '1.3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build tests and check production code
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug -PenableApkSplits=false --stacktrace
      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell settings put system font_scale ${{ matrix.font }}
            adb shell dumpsys battery set level 64
            adb shell dumpsys battery set status 3
            adb shell dumpsys battery set ac 0
            adb shell dumpsys battery set usb 0
            bash tools/run-device-tests.sh
      - name: Preserve reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-tests-api-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            screenshots/
            device-logcat.txt
          if-no-files-found: warn
